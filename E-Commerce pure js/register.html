<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UV-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Page</title>
  <link rel="stylesheet" href="css/all.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
</head>

<body>
  <!-- ----------------------------------------------------------------------------------------------- -->

  <header class="bg-primary" style="height: 70px">
    <div class="container">
      <div class="header-content d-flex justify-content-between">
        <a href="index.html" class="brand d-inline">
          <img src="images/14603825_5484736.jpg" alt="Logo" id="logo-image" width="100px" height="70px" />
        </a>

        <nav>
          <ul id="links" class="mt-3">
            <li><a class="btn" href="login.html">Sign In</a></li>
            <li><a class="btn" href="register.html">Sign up</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  <!-- ----------------------------------------------------------------------------------------------- -->

  <section class="section-form rounded m-5 shadow-lg bg-primary">
    <h2>Register User</h2>

    <form>
      <label class="w-100 text-start" for="userName">User Name</label>
      <input class="rounded bg-light" type="text" placeholder="Enter User Name" id="userName" />
      <label class="w-100 text-start" for="email">Email</label>
      <input class="rounded bg-light" type="email" placeholder="Enter User Email" id="email" />
      <label class="w-100 text-start" for="password">Password</label>
      <input class="rounded bg-light" type="password" placeholder="Enter User password" id="password" />
      <input class="rounded bg-light btn mt-3" type="submit" value="Sign up" id="signUP" />

      Have Already Account? <a href="login.html" class="text-light">Login</a>
    </form>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
    integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
  <script src="js/register.js"></script>
</body>

</html>
